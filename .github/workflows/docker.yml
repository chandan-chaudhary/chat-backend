# Workflow name displayed in GitHub Actions UI
name: Docker Build & Push

# Trigger configuration - when this workflow runs
on:
  # Run on pushes to main branch or version tags (v*)
  push:
    branches: [main]
    tags: ['v*']
  # Run on pull requests targeting main branch
  pull_request:
    branches: [main]
  # Allow manual triggering with optional version input
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

# Environment variables available to all jobs
env:
  # Docker registry to push to
  REGISTRY: docker.io
  # Full image name with username from secrets
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/chat-backend

# Define jobs to run
jobs:
  # Build job - creates and pushes multi-arch Docker image
  build:
    # Run on latest Ubuntu runner
    runs-on: ubuntu-latest
    # Minimum permissions needed for build
    permissions:
      # Read repository contents for checkout
      contents: read
      # Write packages for Docker registry push
      packages: write
    # Outputs for downstream jobs (deploy)
    outputs:
      # Image tags generated by metadata step
      image-tag: ${{ steps.meta.outputs.tags }}
      # Image digest from build step
      image-digest: ${{ steps.build.outputs.digest }}
    # Steps to execute in order
    steps:
      # Checkout repository code to runner workspace
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub (skipped for PRs to prevent secret exposure)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker image
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch/ref name (e.g., main, feature/xyz)
            type=ref,event=branch
            # Tag with PR number (e.g., pr-123)
            type=ref,event=pr
            # Tag with semantic version from git tag (e.g., v1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g., v1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag as 'latest' on default branch (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with git SHA for unique identification
            type=sha

      # Build and push multi-platform Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          # Build context (repository root)
          context: .
          # Dockerfile location
          file: ./Dockerfile
          # Only push on non-PR events (push, tag, manual)
          push: ${{ github.event_name != 'pull_request' }}
          # Tags from metadata step
          tags: ${{ steps.meta.outputs.tags }}
          # Labels from metadata step
          labels: ${{ steps.meta.outputs.labels }}
          # Pull cache from GitHub Actions cache
          cache-from: type=gha
          # Push cache to GitHub Actions cache
          cache-to: type=gha,mode=max
          # Build for AMD64 only (ARM64 QEMU emulation causes illegal instruction errors)
          platforms: linux/amd64
          # Use production target from multi-stage Dockerfile
          target: production
          # Pass dummy DATABASE_URL for prisma generate (doesn't need a real DB at build time)
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

  # Deploy job - runs only on version tag pushes
  deploy:
    # Depends on successful build job
    needs: build
    # Only run on push events with version tags (v*)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Run on latest Ubuntu runner
    runs-on: ubuntu-latest
    # Steps to execute
    steps:
      # Placeholder for deployment commands
      - name: Deploy to production
        run: |
          echo "Deploy image: ${{ needs.build.outputs.image-tag }}"
          echo "Digest: ${{ needs.build.outputs.image-digest }}"
