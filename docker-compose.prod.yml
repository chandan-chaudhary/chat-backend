services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chat-backend-prod
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
